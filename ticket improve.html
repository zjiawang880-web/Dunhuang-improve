
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DUNHUANG | Ticket Guide</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

/* GLOBAL */

:root {
  --dark: #171c19;
  --brown: #96583f;
  --deep: #51342c;
  --gold: #d8b47c;
  --paper: #f7efe5;
  --cream: #fffaf3;
  --line: #e9d8c6;
  --muted: #8b756a;
  --nav-height: 90px;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  scroll-padding-top: 120px;
}

body {
  margin: 0;
  background: var(--paper);
  color: var(--deep);
  font-family: "DM Sans", "Noto Sans SC", sans-serif;
  line-height: 1.7;
}

button, input, select {
  font: inherit;
}

button {
  cursor: pointer;
}

a {
  text-decoration: none;
  color: inherit;
}

button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible {
  outline: 3px solid var(--gold);
  outline-offset: 3px;
}

/* NAVIGATION */

.navbar {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  min-height: 90px;
  padding: 15px 4%;
  z-index: 1000;

  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 25px;

  color: white;
  background: transparent;

  transition: background .3s, box-shadow .3s;
}

.navbar.scrolled {
  background: rgba(23,28,25,.97);
  backdrop-filter: blur(12px);
  box-shadow: 0 5px 25px #0003;
}

.logo {
  font-family: "Cormorant Garamond", serif;
  font-size: 36px;
  font-weight: 600;
  letter-spacing: 3px;
  white-space: nowrap;
  line-height: 1;
}

.logo span {
  color: var(--gold);
}

.nav-links {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 25px;
  flex-wrap: wrap;
}

.nav-links a {
  color: white;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 1px;
  transition: color .3s;
}

.nav-links a:hover {
  color: var(--gold);
}

.nav-actions {
  display: flex;
  align-items: center;
  gap: 9px;
}

.lang-btn,
.senior-button {
  min-height: 44px;
  padding: 8px 12px;

  border: 1px solid #ffffff80;
  background: transparent;
  color: white;

  font-size: 13px;
  font-weight: 600;
}

.senior-button {
  border-color: var(--gold);
  border-radius: 5px;
  white-space: nowrap;
}

.lang-btn.active,
.lang-btn:hover,
.senior-button.active,
.senior-button:hover {
  background: var(--gold);
  border-color: var(--gold);
  color: var(--dark);
}

/* HERO */

.hero {
  position: relative;
  overflow: hidden;
  min-height: 520px;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 175px 6% 100px;
  text-align: center;
  color: #fffaf3;

  background:
    radial-gradient(
      circle at 80% 25%,
      #efba7040,
      transparent 38%
    ),
    linear-gradient(
      120deg,
      #51342c,
      #87503c 65%,
      #b17b56
    );
}

.hero::before {
  content: "";
  position: absolute;
  width: 510px;
  height: 510px;
  right: -160px;
  top: 40px;
  border: 1px solid #f2cd9f55;
  border-radius: 50%;
}

.hero::after {
  content: "";
  position: absolute;
  width: 370px;
  height: 370px;
  right: -85px;
  top: 105px;
  border: 1px solid #f2cd9f35;
  border-radius: 50%;
}

.hero-content {
  position: relative;
  z-index: 2;
  max-width: 1050px;
}

.hero-kicker {
  color: var(--gold);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 4px;
}

.hero h1 {
  font-family: "Cormorant Garamond",
    "Noto Serif SC", serif;

  font-weight: 500;
  font-size: clamp(55px, 8vw, 105px);
  line-height: 1.12;
  margin: 20px 0;
}

.hero-line {
  width: 85px;
  height: 2px;
  margin: 25px auto;
  background: var(--gold);
}

.hero p {
  max-width: 730px;
  margin: auto;
  color: #f1decf;
  font-size: 16px;
  line-height: 2;
}

/* TICKET MAIN */

.ticket-section {
  padding: 90px 5% 110px;
}

.ticket-container {
  max-width: 1350px;
  margin: auto;
}

.section-heading {
  text-align: center;
  max-width: 850px;
  margin: 0 auto 43px;
}

.section-label {
  font-size: 12px;
  color: #a47150;
  font-weight: 700;
  letter-spacing: 3px;
}

.section-heading h2 {
  font-family: "Cormorant Garamond",
    "Noto Serif SC", serif;

  font-weight: 600;
  font-size: clamp(43px, 5.5vw, 70px);
  margin: 10px 0 15px;
  line-height: 1.15;
}

.section-heading p {
  color: var(--muted);
  font-size: 14px;
  line-height: 1.9;
}

/* STATISTICS */

.ticket-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
  margin-bottom: 32px;
}

.stat-card {
  padding: 24px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--cream);
  text-align: center;
}

.stat-card strong {
  display: block;
  font-family: "Cormorant Garamond", serif;
  color: var(--brown);
  font-size: 47px;
  line-height: 1.1;
}

.stat-card span {
  display: block;
  margin-top: 10px;
  color: var(--muted);
  font-size: 13px;
}

/* FILTERS */

.ticket-tools {
  display: flex;
  flex-wrap: wrap;
  gap: 13px;
  margin-bottom: 21px;
}

.ticket-search,
.ticket-category {
  padding: 14px 17px;
  background: #fffdf9;
  border: 1px solid #dec7af;
  border-radius: 9px;
  color: var(--deep);
  font-size: 13px;
}

.ticket-search {
  flex: 1;
  min-width: 220px;
}

.ticket-category {
  min-width: 200px;
}

.ticket-filters {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 30px;
}

.filter-btn {
  padding: 11px 18px;
  border: 1px solid #d9bfa7;
  border-radius: 30px;
  background: var(--cream);
  color: #865840;

  font-size: 12px;
  font-weight: 700;

  transition: .2s;
}

.filter-btn:hover {
  background: #eadbc9;
}

.filter-btn.active {
  background: var(--brown);
  color: white;
  border-color: var(--brown);
}

/* ATTRACTION CARDS */

.ticket-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0,1fr));
  gap: 22px;
}

.attraction-card {
  display: flex;
  flex-direction: column;
  overflow: hidden;

  background: #fffdf9;
  border: 1px solid #e7d4bf;
  border-radius: 14px;

  transition: transform .25s, box-shadow .25s;
}

.attraction-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 15px 35px #67432e20;
}

.attraction-card.strategy-picked {
  border: 2px solid #b47a57;
}

.attraction-cover {
  min-height: 130px;
  padding: 22px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  background:
    linear-gradient(
      120deg,
      #744737,
      #b77f5d
    );

  color: white;
}

.attraction-icon {
  font-size: 45px;
}

.attraction-group {
  font-size: 11px;
  letter-spacing: 1.5px;
  color: #f6e1c6;
}

.attraction-body {
  display: flex;
  flex-direction: column;
  flex: 1;
  gap: 12px;
  padding: 23px;
}

.attraction-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}

.ticket-tag {
  display: inline-block;
  padding: 6px 11px;
  border-radius: 30px;
  background: #f0dfcb;
  color: #85543c;
  font-size: 10px;
  font-weight: 700;
}

.ticket-tag.free {
  background: #e2eee3;
  color: #4b7653;
}

.ticket-tag.check {
  background: #f1e9d8;
  color: #897247;
}

.attraction-body h3 {
  margin: 3px 0 0;
  color: #634334;
  font-size: 21px;
  line-height: 1.4;
}

.attraction-price {
  color: var(--brown);
  font-size: 20px;
  font-weight: 800;
  line-height: 1.5;
}

.attraction-description {
  flex: 1;
  color: #897569;
  font-size: 13px;
  line-height: 1.9;
}

.attraction-actions {
  display: flex;
  gap: 9px;
  margin-top: 9px;
}

.attraction-actions button {
  flex: 1;
  min-width: 0;
  padding: 12px 8px;

  border: 1px solid var(--brown);
  border-radius: 7px;

  font-size: 11px;
  font-weight: 700;
}

.details-btn {
  background: var(--brown);
  color: white;
}

.mark-btn {
  background: #fffaf3;
  color: var(--brown);
}

.mark-btn.done {
  background: #e4d7c7;
}

.empty-result {
  grid-column: 1/-1;
  padding: 40px;
  text-align: center;
  background: var(--cream);
  border: 1px dashed #cbaa89;
  border-radius: 12px;
  color: var(--muted);
}

/* MY TICKET CHECKLIST */

.my-ticket-section {
  margin-top: 60px;
  padding: 35px;
  background: #ebddca;
  border: 1px solid #d7bea6;
  border-radius: 15px;
}

.my-ticket-section h2 {
  font-family: "Cormorant Garamond",
    "Noto Serif SC", serif;

  font-size: 41px;
  margin: 0 0 10px;
}

.my-ticket-section > p {
  color: #846d5b;
  font-size: 13px;
  line-height: 1.9;
}

.my-ticket-list {
  display: grid;
  gap: 11px;
  margin-top: 23px;
}

.my-ticket-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 14px;

  padding: 14px 18px;
  border-radius: 9px;
  background: #fffaf3;
}

.my-ticket-row strong {
  color: var(--deep);
  font-size: 14px;
}

.my-ticket-row span {
  color: #956e50;
  font-size: 12px;
}

.my-ticket-row button {
  border: none;
  background: var(--brown);
  color: white;
  padding: 10px 13px;
  border-radius: 6px;
  font-size: 12px;
}

.ticket-estimate {
  padding-top: 20px;
  font-size: 15px !important;
  color: #80543e !important;
  font-weight: 600;
}

.ticket-note {
  margin-top: 24px;
  color: #987d6b;
  font-size: 12px;
  line-height: 1.9;
}

.strategy-link {
  display: inline-block;
  margin-top: 20px;
  padding: 13px 19px;
  border-radius: 7px;
  background: var(--brown);
  color: white;
  font-size: 12px;
  font-weight: 700;
}

/* DETAIL DIALOG */

.ticket-dialog {
  width: min(800px, 94vw);
  max-height: 86vh;
  padding: 0;

  border: 1px solid #cba783;
  border-radius: 15px;

  background: #fffaf3;
  color: var(--deep);

  overflow-y: auto;
  box-shadow: 0 25px 80px #0005;
}

.ticket-dialog::backdrop {
  background: #171c19b8;
  backdrop-filter: blur(5px);
}

.dialog-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 15px;

  padding: 28px 30px;
  background: linear-gradient(
    110deg,
    #704736,
    #ae7957
  );
  color: white;
}

.dialog-header small {
  color: #ebcca3;
  font-size: 11px;
  letter-spacing: 2px;
}

.dialog-header h2 {
  font-family: "Cormorant Garamond",
    "Noto Serif SC", serif;

  font-size: 42px;
  margin: 6px 0 0;
}

.close-dialog {
  width: 42px;
  height: 42px;
  flex-shrink: 0;
  background: transparent;
  border: 1px solid #ffffff90;
  border-radius: 50%;
  color: white;
  font-size: 25px;
}

.dialog-content {
  padding: 30px;
}

.dialog-content h3 {
  color: var(--brown);
  font-size: 16px;
  margin: 23px 0 7px;
}

.dialog-content p {
  margin: 5px 0;
  color: #705b4d;
  font-size: 14px;
  line-height: 2;
}

.dialog-links {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 25px;
}

.dialog-links a {
  display: inline-block;
  padding: 12px 16px;
  background: var(--brown);
  color: white;
  border-radius: 7px;
  font-size: 12px;
  font-weight: 700;
}

.dialog-links a.secondary {
  background: #ead9c7;
  color: var(--brown);
}

/* BOTTOM NAVIGATION */

.journey-navigation {
  padding: 65px 5%;
  background: var(--dark);
  color: #fffaf3;
}

.journey-inner {
  max-width: 1250px;
  margin: auto;
}

.journey-label {
  text-align: center;
  margin-bottom: 25px;
  color: var(--gold);
  letter-spacing: 3px;
  font-size: 12px;
}

.journey-links {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

.journey-links a {
  padding: 23px;
  border: 1px solid #d8b47c80;
  border-radius: 8px;
  transition: .2s;
}

.journey-links a:hover {
  background: var(--gold);
  color: var(--dark);
}

.journey-links a:last-child {
  text-align: right;
}

.journey-links span {
  display: block;
  font-size: 12px;
  opacity: .8;
  margin-bottom: 7px;
}

.journey-links strong {
  font-size: 20px;
}

footer {
  padding: 38px;
  text-align: center;
  background: #51342c;
  color: #e6caa8;
}

footer h2 {
  font-family: "Cormorant Garamond", serif;
  letter-spacing: 3px;
  font-size: 35px;
  color: white;
  margin: 0;
}

footer p {
  font-size: 12px;
}

/* SENIOR MODE */

body.senior-mode {
  font-size: 20px;
}

body.senior-mode .attraction-description,
body.senior-mode .section-heading p,
body.senior-mode .dialog-content p,
body.senior-mode .my-ticket-section p {
  font-size: 19px;
}

body.senior-mode .nav-links a {
  font-size: 19px;
}

body.senior-mode .filter-btn,
body.senior-mode .attraction-actions button {
  font-size: 16px;
}

/* RESPONSIVE */

@media (max-width: 1250px) {
  .navbar {
    grid-template-columns: auto 1fr;
    row-gap: 13px;
  }

  .nav-actions {
    justify-content: flex-end;
  }

  .nav-links {
    grid-row: 2;
    grid-column: 1/-1;
  }
}

@media (max-width: 1000px) {
  .ticket-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 700px) {
  .navbar {
    padding: 11px 3%;
    column-gap: 8px;
  }

  .logo {
    font-size: 27px;
  }

  .nav-actions {
    gap: 4px;
  }

  .lang-btn,
  .senior-button {
    padding: 7px;
    font-size: 11px;
  }

  .nav-links {
    gap: 10px 15px;
  }

  .nav-links a {
    font-size: 11px;
  }

  .hero {
    padding: 170px 5% 65px;
    min-height: 450px;
  }

  .hero h1 {
    font-size: 55px;
  }

  .ticket-section {
    padding: 60px 4%;
  }

  .ticket-grid,
  .ticket-stats,
  .journey-links {
    grid-template-columns: 1fr;
  }

  .ticket-search,
  .ticket-category {
    width: 100%;
  }

  .my-ticket-section {
    padding: 24px;
  }

  .dialog-content {
    padding: 21px;
  }
}

@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }
}

</style>
</head>

<body>

<!-- NAVIGATION -->

<header class="navbar" id="navbar">

  <a class="logo" id="logoLink" href="./Dunhuang improve.html">
    DUNHUANG<span>.</span>
  </a>

  <nav class="nav-links" id="navLinks"></nav>

  <div class="nav-actions">

    <button class="lang-btn" data-lang="en">EN</button>
    <button class="lang-btn" data-lang="zh">中文</button>
    <button class="lang-btn" data-lang="ms">BM</button>

    <button class="senior-button" id="seniorBtn">
      👓 <span id="seniorText">Senior Mode</span>
    </button>

  </div>

</header>


<!-- HERO -->

<section class="hero">

  <div class="hero-content">

    <span class="hero-kicker">
      THE SILK ROAD · TICKETS & ADMISSION
    </span>

    <h1 id="heroTitle">
      Dunhuang Ticket Guide
    </h1>

    <div class="hero-line"></div>

    <p id="heroDescription"></p>

  </div>

</section>


<!-- MAIN -->

<main>

<section class="ticket-section">

  <div class="ticket-container">

    <div class="section-heading">

      <span class="section-label">
        EXPLORE · PLAN · DISCOVER
      </span>

      <h2 id="sectionTitle"></h2>

      <p id="sectionIntro"></p>

    </div>


    <div class="ticket-stats">

      <div class="stat-card">
        <strong id="totalSelected">0</strong>
        <span id="totalLabel"></span>
      </div>

      <div class="stat-card">
        <strong id="pendingCount">0</strong>
        <span id="pendingLabel"></span>
      </div>

      <div class="stat-card">
        <strong id="readyCount">0</strong>
        <span id="readyLabel"></span>
      </div>

    </div>


    <div class="ticket-tools">

      <input
        type="search"
        class="ticket-search"
        id="ticketSearch"
        autocomplete="off"
      >

      <select
        class="ticket-category"
        id="categorySelect"
      ></select>

    </div>


    <div class="ticket-filters" id="ticketFilters"></div>

    <div class="ticket-grid" id="ticketGrid"></div>


    <p class="ticket-note" id="ticketNotice"></p>


    <div class="my-ticket-section">

      <h2 id="myTicketTitle"></h2>

      <p id="myTicketIntro"></p>

      <div class="my-ticket-list" id="myTicketList"></div>

      <p class="ticket-estimate" id="ticketEstimate"></p>

      <p class="ticket-note" id="estimateNote"></p>

      <a
        class="strategy-link"
        id="strategyLink"
        href="./strategy.html"
      ></a>

    </div>

  </div>

</section>

</main>


<!-- BOTTOM NAVIGATION -->

<section class="journey-navigation">

  <div class="journey-inner">

    <p class="journey-label" id="journeyLabel"></p>

    <div class="journey-links">

      <a id="previousLink" href="./Dunhuang improve.html#journey">
        <span id="previousText"></span>
        <strong id="previousName"></strong>
      </a>

      <a id="nextLink" href="./transport improve.html">
        <span id="nextText"></span>
        <strong id="nextName"></strong>
      </a>

    </div>

  </div>

</section>


<footer>
  <h2>DUNHUANG.</h2>
  <p id="footerText"></p>
</footer>


<!-- DETAILS POPUP -->

<dialog class="ticket-dialog" id="ticketDialog">

  <div class="dialog-header">

    <div>
      <small id="dialogCategory"></small>
      <h2 id="dialogTitle"></h2>
    </div>

    <button
      class="close-dialog"
      id="closeDialog"
      aria-label="Close"
    >×</button>

  </div>

  <div class="dialog-content" id="dialogContent"></div>

</dialog>


<script>

/* =========================================
   LANGUAGE
========================================= */

const $ = id => document.getElementById(id);

let currentLanguage = "en";

const languageIndex = {
  en: 0,
  zh: 1,
  ms: 2
};

function tr(values) {
  if (!Array.isArray(values)) {
    return String(values ?? "");
  }

  return values[languageIndex[currentLanguage]] ?? values[0];
}

function escapeHTML(value) {
  return String(value ?? "").replace(
    /[&<>"']/g,
    c => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[c]
  );
}


/* =========================================
   MULTILINGUAL TEXT
========================================= */

const i18n = {

  en: {
    nav: ["HOME","EXPLORE","JOURNEY","STORIES","FAQ","ABOUT"],
    senior: "Senior Mode",
    hero: "Dunhuang Ticket Guide",
    heroDesc: "From ancient caves and Silk Road ruins to golden deserts, discover ticket information for every stop of your journey.",
    sectionTitle: "Explore Dunhuang Tickets",
    intro: "Compare ticket prices, booking information and visiting tips. You can also find the attractions selected in your personal Strategy.",
    total: "Selected in Strategy",
    pending: "Not Arranged",
    ready: "Arranged",
    search: "Search attractions...",
    all: "All Attractions",
    mine: "My Strategy Picks",
    paid: "Paid Admission",
    free: "Free Entry",
    check: "Check Access",
    allCategories: "All Categories",
    cave: "Caves & Murals",
    heritage: "History & Ruins",
    nature: "Desert & Nature",
    city: "City & Culture",
    selected: "✓ In My Strategy",
    detail: "Ticket Details",
    mark: "Mark as Arranged",
    done: "✓ Arranged",

const bookingMethods = {

/* =========================================
   STORAGE
========================================= */

const STRATEGY_KEY = "dunhuang-custom-travel-guide";
const TICKET_KEY = "dunhuang-ticket-checklist-v1";

let ticketStatus = {};

try {
  ticketStatus = JSON.parse(
    localStorage.getItem(TICKET_KEY) || "{}"
  );
} catch {
  ticketStatus = {};
}

let currentFilter = "all";
let currentCategory = "all";
let searchText = "";


function getStrategySelections() {
  try {
    const data = JSON.parse(
      localStorage.getItem(STRATEGY_KEY) || "{}"
    );

    if (Array.isArray(data.attractions)) {
      return [...new Set(data.attractions.map(String))];
    }

  } catch (error) {
    console.warn("Cannot read Strategy:", error);
  }

  return [];
}


function saveTicketStatus() {
  try {
    localStorage.setItem(
      TICKET_KEY,
      JSON.stringify(ticketStatus)
    );
  } catch (error) {
    console.warn("Cannot save ticket status:", error);
  }
}


/* =========================================
   NAVIGATION
========================================= */

const HOME_FILE = "./Dunhuang improve.html";

function updateNavigation() {

  const t = i18n[currentLanguage];

  const sections = [
    "home",
    "experiences",
    "journey",
    "stories",
    "faq",
    "about"
  ];

        ? `./about.html?lang=${currentLanguage}`
        : `${HOME_FILE}?lang=${currentLanguage}#${section}`;

    return `

        ${escapeHTML(t.nav[index])}
      </a>
    `;

  }).join("");

    `${HOME_FILE}?lang=${currentLanguage}#home`;

  $("strategyLink").href =
    `./strategy.html?lang=${currentLanguage}`;


  $("seniorText").textContent = t.senior;

  $("journeyLabel").textContent = t.journey;

  $("previousText").textContent = t.previous;
  $("previousName").textContent = t.homeName;

  $("nextText").textContent = t.next;
  $("nextName").textContent = t.transportName;

  $("footerText").textContent = t.footer;

}


/* =========================================
   STATISTICS
========================================= */

function renderStats() {

  const picked = getStrategySelections();

  const completed = picked.filter(
    id => ticketStatus[id]
  ).length;

  const t = i18n[currentLanguage];

  $("totalSelected").textContent = picked.length;
  $("pendingCount").textContent = picked.length - completed;
  $("readyCount").textContent = completed;

  $("totalLabel").textContent = t.total;
  $("pendingLabel").textContent = t.pending;
  $("readyLabel").textContent = t.ready;

}


/* =========================================
   FILTERS
========================================= */

function renderFilters() {

  const t = i18n[currentLanguage];

  const filters = [
    "all",
    "mine",
    "paid",
    "free",
    "check"
  ];

  $("ticketFilters").innerHTML = filters.map(key => `
    <button
      type="button"
      class="filter-btn ${currentFilter === key ? "active" : ""}"
      data-filter="${key}"
    >
      ${escapeHTML(t[key])}
    </button>
  `).join("");


  const categories = [
    "all",
    "cave",
    "heritage",
    "nature",
    "city"
  ];

  $("categorySelect").innerHTML = categories.map(key => `
    <option value="${key}">
      ${escapeHTML(
        key === "all" ? t.allCategories : t[key]
      )}
    </option>
  `).join("");

  $("categorySelect").value = currentCategory;

}


/* =========================================
   ATTRACTION CARDS
========================================= */

function makeAttractionCard(item) {

  const t = i18n[currentLanguage];

  const picked = getStrategySelections();

  const inStrategy = picked.includes(item.id);

  const isDone = !!ticketStatus[item.id];

  return `

    <article class="attraction-card ${
      inStrategy ? "strategy-picked" : ""
    }">

      <div class="attraction-cover">

        <span class="attraction-icon">
          ${item.icon}
        </span>

        <span class="attraction-group">
          ${escapeHTML(t[item.category])}
        </span>

      </div>


      <div class="attraction-body">

        <div class="attraction-tags">

          <span class="ticket-tag ${item.type}">
            ${escapeHTML(t.categories[item.type])}
          </span>

          ${
            inStrategy
              ? `<span class="ticket-tag">
                   ${escapeHTML(t.selected)}
                 </span>`
              : ""
          }

        </div>


        <h3>${escapeHTML(tr(item.name))}</h3>

        <div class="attraction-price">
          ${escapeHTML(tr(item.price))}
        </div>

        <p class="attraction-description">
          ${escapeHTML(tr(item.description))}
        </p>


        <div class="attraction-actions">

          <button
            type="button"
            class="details-btn"
            data-detail="${item.id}"
          >
            ${escapeHTML(t.detail)}
          </button>

          <button
            type="button"
            class="mark-btn ${isDone ? "done" : ""}"
            data-mark="${item.id}"
          >
            ${escapeHTML(isDone ? t.done : t.mark)}
          </button>

        </div>

      </div>

    </article>

  `;
}


function renderAttractions() {

  const t = i18n[currentLanguage];

  const picked = getStrategySelections();

  const sorted = [...attractions].sort(
    (a, b) =>
      Number(picked.includes(b.id)) -
      Number(picked.includes(a.id))
  );


  const filtered = sorted.filter(item => {

    if (
      currentFilter === "mine" &&
      !picked.includes(item.id)
    ) {
      return false;
    }

    if (
      ["paid", "free", "check"].includes(currentFilter) &&
      item.type !== currentFilter
    ) {
      return false;
    }

    if (
      currentCategory !== "all" &&
      item.category !== currentCategory
    ) {
      return false;
    }


    const query = searchText.trim().toLowerCase();

    if (!query) return true;

    return item.name.some(name =>
      name.toLowerCase().includes(query)
    ) || item.id.includes(query);

  });


  $("ticketGrid").innerHTML = filtered.length

    ? filtered.map(makeAttractionCard).join("")

    : `
      <div class="empty-result">
        ${escapeHTML(t.empty)}
      </div>
    `;

  renderMyTicketList();
  renderStats();

}


/* =========================================
   MY TICKET LIST
========================================= */

function renderMyTicketList() {

  const t = i18n[currentLanguage];

  const picked = getStrategySelections();

  if (!picked.length) {

    $("myTicketList").innerHTML = `
      <div class="empty-result">
        ${escapeHTML(t.noPicks)}
      </div>
    `;

  } else {

    $("myTicketList").innerHTML = picked.map(id => {

      const item = attractions.find(a => a.id === id);

      const name = item ? tr(item.name) : id;

      const price = item ? tr(item.price) : "";

      const done = !!ticketStatus[id];

      return `

        <div class="my-ticket-row">

          <strong>${escapeHTML(name)}</strong>

          <span>${escapeHTML(price)}</span>

          <button
            type="button"
            data-mark="${escapeHTML(id)}"
          >
            ${escapeHTML(done ? t.done : t.mark)}
          </button>

        </div>

      `;

    }).join("");

  }


  const known = picked
    .map(id => attractions.find(a => a.id === id))
    .filter(item =>
      item &&
      item.type === "paid" &&
      Number.isFinite(item.amount)
    );

  const total = known.reduce(
    (sum, item) => sum + item.amount,
    0
  );

  $("ticketEstimate").textContent =
    `${t.estimate}: ¥${total}`;

  $("estimateNote").textContent =
    `${known.length} priced attractions. ${t.estimateNote}`;

}


/* =========================================
   TICKET DETAILS
========================================= */

function openDetails(id) {

  const item = attractions.find(a => a.id === id);

  if (!item) return;

  const t = i18n[currentLanguage];

  $("dialogCategory").textContent =
    t[item.category] + " · " + t.categories[item.type];

  $("dialogTitle").textContent =
    tr(item.name);


  const booking =
    bookingMethods[currentLanguage][item.type];


  const officialLink = item.official

    ? `
      <a
        href="${escapeHTML(item.official)}"
        target="_blank"
        rel="noopener noreferrer"
      >
        ${escapeHTML(t.official)}
      </a>
    `

    : `
      <a
        href="https://www.google.com/search?q=${
          encodeURIComponent(
            item.name[1] + " 门票 预约 官网"
          )
        }"
        target="_blank"
        rel="noopener noreferrer"
      >
        ${escapeHTML(t.google)}
      </a>
    `;


  const mapLink = `
    <a
      class="secondary"
      href="https://www.google.com/maps/search/?api=1&query=${
        encodeURIComponent(
          item.name[1] + " 甘肃 敦煌 中国"
        )
      }"
      target="_blank"
      rel="noopener noreferrer"
    >
      ${escapeHTML(t.maps)}
    </a>
  `;


  $("dialogContent").innerHTML = `

    <h3>${escapeHTML(t.info)}</h3>

    <p>${escapeHTML(tr(item.description))}</p>


    <h3>${escapeHTML(t.price)}</h3>

    <p>
      <strong>${escapeHTML(tr(item.price))}</strong>
    </p>


    <h3>${escapeHTML(t.booking)}</h3>

    <p>${escapeHTML(booking)}</p>


    <h3>${escapeHTML(t.tip)}</h3>

    <p>${escapeHTML(tr(item.tip))}</p>


    <div class="dialog-links">
      ${officialLink}
      ${mapLink}
    </div>


    <p style="
      margin-top:25px;
      color:#9b806c;
      font-size:12px;
    ">
      ${escapeHTML(t.notice)}
    </p>

  `;

  $("ticketDialog").showModal();

}


/* =========================================
   BUTTON EVENTS
========================================= */

document.addEventListener("click", function(event) {

  const filterButton = event.target.closest(
    "[data-filter]"
  );

  if (filterButton) {

    currentFilter = filterButton.dataset.filter;

    renderFilters();
    renderAttractions();

    return;
  }


  const detailsButton = event.target.closest(
    "[data-detail]"
  );

  if (detailsButton) {

    openDetails(detailsButton.dataset.detail);

    return;
  }


  const markButton = event.target.closest(
    "[data-mark]"
  );

  if (markButton) {

    const id = markButton.dataset.mark;

    ticketStatus[id] = !ticketStatus[id];

    saveTicketStatus();

    renderAttractions();

    return;
  }

});


$("ticketSearch").addEventListener(
  "input",
  function(event) {

    searchText = event.target.value;

    renderAttractions();

  }
);


$("categorySelect").addEventListener(
  "change",
  function(event) {

    currentCategory = event.target.value;

    renderAttractions();

  }
);


/* =========================================
   CLOSE DIALOG
========================================= */

$("closeDialog").addEventListener(
  "click",
  () => $("ticketDialog").close()
);


$("ticketDialog").addEventListener(
  "click",
  event => {

    if (event.target === $("ticketDialog")) {
      $("ticketDialog").close();
    }

  }
);


/* =========================================
   LANGUAGE SWITCHING
========================================= */

function setLanguage(lang) {

  if (!["en", "zh", "ms"].includes(lang)) {
    lang = "en";
  }

  currentLanguage = lang;

  document.documentElement.lang =
    lang === "zh" ? "zh-CN" : lang;

  try {

    localStorage.setItem(
      "dunhuang-language",
      lang
    );

  } catch {}


  const url = new URL(window.location.href);

  url.searchParams.set("lang", lang);

  history.replaceState(null, "", url);


  document.querySelectorAll(".lang-btn").forEach(btn => {

    btn.classList.toggle(
      "active",
      btn.dataset.lang === lang
    );

  });


  render();

}


document.querySelectorAll(".lang-btn").forEach(btn => {

  btn.addEventListener("click", () => {

    setLanguage(btn.dataset.lang);

  });

});


/* =========================================
   SENIOR MODE
========================================= */

$("seniorBtn").addEventListener("click", () => {

  const active = document.body.classList.toggle(
    "senior-mode"
  );

  $("seniorBtn").classList.toggle(
    "active",
    active
  );

  try {
    localStorage.setItem(
      "dunhuang-senior-mode",
      String(active)
    );
  } catch {}

});


/* =========================================
   SCROLL NAVBAR
========================================= */

function updateNavbar() {

  const navbar = $("navbar");

  navbar.classList.toggle(
    "scrolled",
    window.scrollY > 30
  );

  document.documentElement.style.setProperty(
    "--nav-height",
    navbar.offsetHeight + "px"
  );

}


window.addEventListener(
  "scroll",
  updateNavbar,
  { passive: true }
);

window.addEventListener(
  "resize",
  updateNavbar
);


/* =========================================
   COMPLETE RENDER
========================================= */

function render() {

  const t = i18n[currentLanguage];

  updateNavigation();

  $("heroTitle").textContent = t.hero;
  $("heroDescription").textContent = t.heroDesc;

  $("sectionTitle").textContent = t.sectionTitle;
  $("sectionIntro").textContent = t.intro;

  $("ticketSearch").placeholder = t.search;

  $("myTicketTitle").textContent = t.myTitle;
  $("myTicketIntro").textContent = t.myIntro;

  $("ticketNotice").textContent = t.notice;

  $("strategyLink").textContent = t.strategy;

  document.title = t.hero + " | DUNHUANG";

  renderFilters();
  renderAttractions();

}


/* =========================================
   STRATEGY SYNCHRONISATION
========================================= */

window.addEventListener("storage", event => {

  if (event.key === TICKET_KEY) {

    try {
      ticketStatus = JSON.parse(
        event.newValue || "{}"
      );
    } catch {
      ticketStatus = {};
    }

  }

  if (
    event.key === STRATEGY_KEY ||
    event.key === TICKET_KEY
  ) {
    renderAttractions();
  }

});


window.addEventListener("pageshow", () => {
  renderAttractions();
});


/* =========================================
   INITIALISE
========================================= */

function initialise() {

  const params = new URLSearchParams(
    window.location.search
  );

  let lang = params.get("lang");

  if (!["en", "zh", "ms"].includes(lang)) {

    try {
      lang = localStorage.getItem(
        "dunhuang-language"
      ) || "en";
    } catch {
      lang = "en";
    }

  }


  try {

    if (
      localStorage.getItem(
        "dunhuang-senior-mode"
      ) === "true"
    ) {

      document.body.classList.add("senior-mode");

      $("seniorBtn").classList.add("active");

    }

  } catch {}


  setLanguage(lang);

  updateNavbar();

}


initialise();

</script>

<script>
(function () {
  "use strict";

  const HOME_PAGE = "./Dunhuang improve.html";

  const labels = {
    en: "REVIEWS",
    zh: "旅人说",
    ms: "ULASAN"
  };

  const nav = document.querySelector(
    ".navbar .nav-links, #navLinks"
  );

  if (!nav) return;

  function getLanguage() {
    const value = (
      document.documentElement.lang || "en"
    ).toLowerCase();

    if (value.startsWith("zh")) return "zh";

    if (
      value.startsWith("ms") ||
      value.startsWith("bm")
    ) return "ms";

    return "en";
  }

  function updateReviewsNavigation() {
    const language = getLanguage();

    const onHomepage =
      document.getElementById("dhReviews") !== null;

    const href = onHomepage
      ? "#dhReviews"
      : HOME_PAGE +
        "?lang=" + language +
        "#dhReviews";

    let link = nav.querySelector(
      '[data-dh-reviews-nav="true"]'
    );

    if (!link) {

      link = document.createElement("a");

      link.dataset.dhReviewsNav = "true";

      // Find FAQ so Reviews appears before it.

      const faq = Array.from(
        nav.querySelectorAll("a")
      ).find(a =>
        a.getAttribute("href")?.includes("#faq") ||
        a.dataset.i18n === "navFAQ"
      );

      // Support existing <ul><li> navigation
      // and newer directly rendered <a> links.

      if (nav.tagName === "UL") {

        const li = document.createElement("li");
        li.appendChild(link);

        const faqItem = faq
          ? faq.closest("li")
          : null;

        if (
          faqItem &&
          faqItem.parentElement === nav
        ) {
          nav.insertBefore(li, faqItem);
        } else {
          nav.appendChild(li);
        }

      } else {

        if (faq && faq.parentElement === nav) {
          nav.insertBefore(link, faq);
        } else {
          nav.appendChild(link);
        }

      }

    }

    if (link.textContent !== labels[language]) {
      link.textContent = labels[language];
    }

    if (link.getAttribute("href") !== href) {
      link.setAttribute("href", href);
    }

  }

  // Re-add the link if a page rebuilds its
  // navigation during language switching.

  const navObserver = new MutationObserver(
    updateReviewsNavigation
  );

  navObserver.observe(nav, {
    childList: true
  });

  // Update wording when HTML language changes.

  new MutationObserver(
    updateReviewsNavigation
  ).observe(
    document.documentElement,
    {
      attributes: true,
      attributeFilter: ["lang"]
    }
  );

  // Support language buttons.

  document.querySelectorAll(
    "[data-lang]"
  ).forEach(button => {

    button.addEventListener("click", () => {
      setTimeout(updateReviewsNavigation, 0);
    });

  });

  updateReviewsNavigation();

})();
</script>

.dh-global-tools button:hover {
  transform: translateY(-4px);
}

.dh-global-ai {
  background: #171c19;
  border: 2px solid #d8b47c;
  color: #d8b47c;
}

.dh-global-top {
  background: #d8b47c;
  border: none;
  color: #171c19;
}

/* AI CHAT WINDOW */

.dh-global-chat {
  position: fixed;
  right: 120px;
  bottom: 30px;
  z-index: 20001;

  width: min(450px, calc(100vw - 150px));
  height: min(650px, calc(100dvh - 60px));

  background: #fffaf0;
  border: 1px solid #d8b47c;
  border-radius: 16px;
  box-shadow: 0 15px 50px #0006;
  overflow: hidden;
}

.dh-global-chat[hidden] {
  display: none !important;
}

.dh-global-frame {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
  background: #fffaf0;
}

.dh-global-close {
  position: absolute;
  top: 9px;
  right: 10px;
  z-index: 10;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: none;
  background: #51342c;
  color: white;
  font-size: 22px;
  cursor: pointer;
}

.dh-global-loading {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 35px;
  text-align: center;
  color: #85583c;
  background: #fffaf0;
  font-size: 14px;
}

/* SENIOR MODE */

body.senior-mode .dh-global-tools button {
  width: 82px;
  height: 82px;
  font-size: 38px;
}

/* MOBILE */

@media(max-width:700px) {

  .dh-global-tools {
    right: 18px;
    bottom: 20px;
    gap: 16px;
  }

  .dh-global-tools button {
    width: 55px;
    height: 55px;
    font-size: 26px;
  }

  .dh-global-chat {
    right: 10px;
    bottom: 160px;
    width: calc(100vw - 20px);
    height: min(560px, calc(100dvh - 180px));
  }
}
</style>


<script>
(function () {
  "use strict";

  // 原本的敦煌首页文件名
  const HOME_PAGE = "./Dunhuang%20AI.html";

  // 避免在已有按钮的页面重复创建
  const hasOriginalAI =
    !!document.getElementById("aiFloating");

  const hasOriginalTop =
    !!document.querySelector(".floating-top");

  if (hasOriginalAI && hasOriginalTop) return;

  const tools = document.createElement("div");
  tools.className = "dh-global-tools";

  // Create buttons
  const aiButton = document.createElement("button");
  aiButton.className = "dh-global-ai";
  aiButton.type = "button";
  aiButton.textContent = "✦";
  aiButton.title = "Dunhuang AI Guide";
  aiButton.setAttribute("aria-label", "Open AI Guide");

  const topButton = document.createElement("button");
  topButton.className = "dh-global-top";
  topButton.type = "button";
  topButton.textContent = "↑";
  topButton.title = "Back to Top";
  topButton.setAttribute("aria-label", "Back to Top");

  if (!hasOriginalAI) tools.appendChild(aiButton);
  if (!hasOriginalTop) tools.appendChild(topButton);

  document.body.appendChild(tools);

  /* BACK TO TOP */

  topButton.addEventListener("click", function () {
    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  });

  /* AI WINDOW */

  if (hasOriginalAI) return;

  const panel = document.createElement("div");
  panel.className = "dh-global-chat";
  panel.hidden = true;

  const frame = document.createElement("iframe");
  frame.className = "dh-global-frame";
  frame.title = "Dunhuang AI Guide";

  const close = document.createElement("button");
  close.className = "dh-global-close";
  close.type = "button";
  close.textContent = "×";
  close.setAttribute("aria-label", "Close AI Guide");

  const loading = document.createElement("div");
  loading.className = "dh-global-loading";
  loading.textContent = "Opening Dunhuang AI Guide...";

  panel.append(frame, loading, close);
  document.body.appendChild(panel);

  let loaded = false;

  function getLanguage() {
    const lang = (
      document.documentElement.lang || "en"
    ).toLowerCase();

    if (lang.startsWith("zh")) return "zh";
    if (lang.startsWith("ms") || lang.startsWith("bm")) return "ms";
    return "en";
  }

  /* Reuse the real AI window from homepage */

  frame.addEventListener("load", function () {

    try {
      const doc = frame.contentDocument;

      if (!doc || !doc.getElementById("aiFloating")) {
        throw new Error("Homepage AI not found");
      }

      // Hide homepage content inside the iframe.
      // Show only the original AI chat.
      const style = doc.createElement("style");

      style.textContent = `
        html, body {
          margin: 0 !important;
          padding: 0 !important;
          overflow: hidden !important;
          background: #fffaf0 !important;
        }

        body > :not(#aiWindow) {
          display: none !important;
        }

        #aiWindow {
          position: fixed !important;
          inset: 0 !important;
          width: 100% !important;
          height: 100% !important;
          max-width: none !important;
          max-height: none !important;
          border-radius: 0 !important;
          display: flex !important;
          box-shadow: none !important;
          z-index: 100 !important;
        }

        #aiWindow[hidden] {
          display: none !important;
        }

        #aiClose {
          display: none !important;
        }
      `;

      doc.head.appendChild(style);

      // Set language to match the current page
      const languageButton = doc.querySelector(
        '.language-switcher button[data-lang="' +
        getLanguage() + '"]'
      );

      languageButton?.click();

      // Open homepage's existing AI functionality
      const button = doc.getElementById("aiFloating");

      const aiWindow = doc.getElementById("aiWindow");

      if (aiWindow.hidden) {
        button.click();
      }

      loaded = true;
      loading.style.display = "none";

    } catch (error) {

      loading.innerHTML = "";

      const fallback = document.createElement("a");
      fallback.href = HOME_PAGE;
      fallback.textContent = "Open AI on Homepage ↗";
      fallback.style.color = "#96583f";

      loading.appendChild(fallback);

      console.warn("AI guide:", error);
    }

  });


  /* OPEN AI */

  function openAI() {

    panel.hidden = false;
    aiButton.setAttribute("aria-expanded", "true");

    if (!loaded && !frame.src) {
      frame.src = HOME_PAGE;
    }

  }


  /* CLOSE AI */

  function closeAI() {

    panel.hidden = true;
    aiButton.setAttribute("aria-expanded", "false");

    try {
      frame.contentWindow.speechSynthesis?.cancel();
    } catch {}

  }


  aiButton.addEventListener("click", () => {

    if (panel.hidden) {
      openAI();
    } else {
      closeAI();
    }

  });

  close.addEventListener("click", closeAI);

  document.addEventListener("keydown", event => {

    if (event.key === "Escape" && !panel.hidden) {
      closeAI();
    }

  });

})();
</script>

<!-- END GLOBAL FLOATING TOOLS -->

</body>
</html>
